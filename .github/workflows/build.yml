name: build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: setup_alpine
        uses: rorgoroth/setup-alpine@develop
        with:
          branch: edge
          extra-repositories: |
            http://dl-cdn.alpinelinux.org/alpine/edge/testing

      - name: setup_git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: add_packages
        run: |
          apk add alpine-sdk bash clang coreutils cmake git libc++ linux-headers lld make python3 samurai zstd
        shell: alpine.sh --root {0}

      - name: run_build
        run: |
          sh build.sh
        shell: alpine.sh {0}

      - name: get_version
        id: version
        run: |
          echo "value=$(sed -n 's/^LLVM_VERSION="\(.*\)"$/\1/p' build.sh)" >> "$GITHUB_OUTPUT"

      - name: upload_packages
        id: upload_release
        uses: svenstaro/upload-release-action@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.version.outputs.value }}.tar.zst
          tag: ${{ steps.version.outputs.value }}
          overwrite: true
          file_glob: true
